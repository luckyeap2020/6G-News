name: Build Hexo

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm install

      - name: Hexo generate
        run: npx hexo generate

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
